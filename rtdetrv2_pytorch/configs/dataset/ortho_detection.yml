task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox', ]

# 32 permanent teeth (FDI 11..48). category_id == 0-based label. num_classes is
# shared into OrthoDetection, pinning categories to 0..31 across all splits.
num_classes: 32

# OrthoDetection reads the YOLO dataset directly: images + sibling .txt labels
# live under this root; split files list one image path per line.
_ortho_root: &ortho_root /mnt/data/abi/datasets/Orthodontics/Lux/Annotated/Seg_only/OrthoTracked_156_subjects

train_dataloader:
  type: DataLoader
  dataset:
    type: OrthoDetection
    img_folder: *ortho_root
    split_file: /mnt/data/abi/datasets/Orthodontics/Lux/Annotated/Seg_only/OrthoTracked_156_subjects/train.txt
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 4
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction

val_dataloader:
  type: DataLoader
  dataset:
    type: OrthoDetection
    img_folder: *ortho_root
    split_file: /mnt/data/abi/datasets/Orthodontics/Lux/Annotated/Seg_only/OrthoTracked_156_subjects/val.txt
    transforms:
      type: Compose
      ops: ~
  shuffle: False
  num_workers: 4
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction
