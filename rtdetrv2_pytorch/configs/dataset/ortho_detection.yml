task: detection

# COCO eval removed for ortho runs: each FDI tooth occurs at most once per image,
# so per-tooth P/R/F1 (computed in the eval loop, see src/misc/per_tooth_eval.py) is
# the validation metric, and best.pth is selected on val micro-F1. The test split is
# evaluated once at the end of training (det_solver._test_eval).
per_tooth_eval:
  score_thr: 0.5
  iou_thr: 0.5
  # test_split_file: ~   # defaults to <val split dir>/test.txt

# 32 permanent teeth (FDI 11..48). category_id == 0-based label. num_classes is
# shared into OrthoDetection, pinning categories to 0..31 across all splits.
num_classes: 32

# OrthoDetection reads the YOLO dataset directly: images + sibling .txt labels
# live under this root; split files list one image path per line.
_ortho_root: &ortho_root /mnt/data/abi/datasets/Orthodontics/Lux/Annotated/Seg_only/OrthoTracked_301_montages

train_dataloader:
  type: DataLoader
  dataset:
    type: OrthoDetection
    img_folder: *ortho_root
    split_file: /mnt/data/abi/datasets/Orthodontics/Lux/Annotated/Seg_only/OrthoTracked_301_montages/train.txt
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 4
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction

val_dataloader:
  type: DataLoader
  dataset:
    type: OrthoDetection
    img_folder: *ortho_root
    split_file: /mnt/data/abi/datasets/Orthodontics/Lux/Annotated/Seg_only/OrthoTracked_301_montages/val.txt
    transforms:
      type: Compose
      ops: ~
  shuffle: False
  num_workers: 4
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction
