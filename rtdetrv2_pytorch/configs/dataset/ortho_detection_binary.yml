task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox', ]

# tooth / no-tooth detection: a single foreground class (background is implicit)
num_classes: 1
remap_mscoco_category: False

_ortho_root: &ortho_root /mnt/data/abi/datasets/Orthodontics/Lux/Annotated/Seg_only/OrthoTracked_v9

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: *ortho_root
    ann_file: /mnt/data/abi/datasets/Orthodontics/Lux/Annotated/Seg_only/OrthoTracked_v9/coco/instances_train_tooth.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 4
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: *ortho_root
    ann_file: /mnt/data/abi/datasets/Orthodontics/Lux/Annotated/Seg_only/OrthoTracked_v9/coco/instances_val_tooth.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: False
  num_workers: 4
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction
