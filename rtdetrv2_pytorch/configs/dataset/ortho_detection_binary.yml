task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox', ]

# tooth / no-tooth detection: a single foreground class (background is implicit).
# single_class collapses all 32 FDI labels to one 'tooth' class on the fly.
num_classes: 1

_ortho_root: &ortho_root /mnt/data/abi/datasets/Orthodontics/Lux/Annotated/Seg_only/OrthoTracked_v9

train_dataloader:
  type: DataLoader
  dataset:
    type: OrthoDetection
    img_folder: *ortho_root
    split_file: /mnt/data/abi/datasets/Orthodontics/Lux/Annotated/Seg_only/OrthoTracked_v9/train.txt
    single_class: True
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 4
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction

val_dataloader:
  type: DataLoader
  dataset:
    type: OrthoDetection
    img_folder: *ortho_root
    split_file: /mnt/data/abi/datasets/Orthodontics/Lux/Annotated/Seg_only/OrthoTracked_v9/val.txt
    single_class: True
    transforms:
      type: Compose
      ops: ~
  shuffle: False
  num_workers: 4
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction
